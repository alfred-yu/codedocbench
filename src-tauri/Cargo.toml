[package]
name = "codedocbench"
version = "0.1.0"
description = "A blank-window desktop application built with Tauri and Python"
authors = ["you"]
edition = "2021"

[lib]
name = "codedocbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
